<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logged Out - Gym Management System</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0b1120 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px 10px;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        }
        .logout-card {
            width: 100%;
            max-width: 460px;
            background: #ffffff;
            border-radius: 1rem;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.35);
            overflow: hidden;
            text-align: center;
        }
        .logout-icon-wrapper {
            width: 80px;
            height: 80px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(25, 135, 84, 0.12);
            color: #198754;
            border-radius: 50%;
        }
    </style>
</head>
<body>

<div class="logout-card p-4 p-md-5">
    <div class="logout-icon-wrapper mb-3">
        <i class="bi bi-check-circle-fill fs-1"></i>
    </div>

    <h3 class="fw-bold text-dark mb-1">Logged Out</h3>
    <p class="text-muted small mb-4">
        Your session has ended successfully. Thank you for using the Gym Management System.
    </p>

    <div class="card bg-light border-0 p-3 mb-4 text-start">
        <div class="d-flex justify-content-between align-items-center mb-1">
            <span class="text-muted small">Previous Session:</span>
            <span class="badge {% if role == 'admin' %}bg-dark{% else %}bg-primary{% endif %} text-uppercase small">
                {{ role }}
            </span>
        </div>
        <div class="fw-semibold text-dark">{{ user_name }}</div>
    </div>

    <div class="d-grid gap-2">
        <a href="{{ url_for('auth.login', role='admin') }}" class="btn btn-primary py-2 fw-semibold">
            <i class="bi bi-shield-lock-fill me-1"></i> Log In as Administrator
        </a>
        <a href="{{ url_for('auth.login', role='user') }}" class="btn btn-outline-secondary py-2 fw-semibold">
            <i class="bi bi-person-fill me-1"></i> Log In as Member
        </a>
    </div>

    <div class="mt-4 pt-3 border-top text-muted" style="font-size: 0.75rem;">
        Gym Management System &bull; Titan Fitness
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
